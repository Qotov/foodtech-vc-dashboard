# Monthly-average FX reference rates to USD, based on ECB reference rates.
# Keyed by "CUR YYYY-MM"; the normalizer picks the month of each deal's date.
# These are baked in so the pipeline is reproducible offline. To refresh from
# live ECB data, run `node pipeline/fetch-fx.mjs` (writes back to this file);
# values here are rounded monthly averages sufficient for round-size analysis.
#
# rate = USD per 1 unit of currency.
